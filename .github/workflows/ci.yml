name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race
      - name: Gofmt
        run: test -z "$(gofmt -l . | grep -v rhm-go)" || { gofmt -l . | grep -v rhm-go; exit 1; }
